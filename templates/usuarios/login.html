{% extends 'shared/base.html' %}
{% load static %}
{% block content %}
            <section>
                <form action="{% url 'login' %}" method="POST">
                    {% csrf_token %}
                    <div class="row">
                        {% for field in form.visible_fields %}
                            <div class="col-12 col-lg-12" tyle="margin-bottom: 10px">
                                <label for="{{ form.id_for_label }}" style="color:#D9D9D9; margin-bottom: 5px">{{ field.label }}</label>
                                {{ field }}
                            </div>
                        {% endfor %}
                    </div>
                    <div>
                        <button class="btn btn-success col-12 btn mt-4" type="submit">Login</button>
                    </div>
                </form>
            </section>
                    <div class="row">
                        <p style="color: #D9D9D9;">Autenticação Externa</p>
                    <div class="social-media">
                        <div class="social-media-details">
                            <a href="http://localhost:8000/accounts/google/login/?process=login" >
                                <img src="{% static '/assets/ícones/1x/google.png' %}">
                            </a>
                        </div>
                    </div>  
        </section>
    </main>
</div>
{% endblock %}
