{% load static %}
<div class="pagina-inicial">
    <header class="cabecalho">
        <a href="{% url 'buscar' %}"><img src="{% static '/assets/logo/Logo(2).png' %}" alt="Logo Exploring Space" /></a>
        <div class="cabecalho__busca">
            <div class="busca__fundo">
                <form action="{% url 'buscar' %}">
                    <input class="busca__input" type="text" name="buscar" placeholder="O que você procura?">
                    <button type="submit">
                        <img  src="{% static '/assets/ícones/1x/search.png' %}" alt="ícone de search">
                    </button>
                </form>
            </div>
        </div>
        {% if not user.is_authenticated %}
        <a href="{% url 'login' %}"><img src="{% static '/assets/ícones/1x/login.png' %}"></a>
        <a href="{% url 'cadastro' %}"><img src="{% static '/assets/ícones/1x/register.png' %}"></a>
        {% else%}
            <a href="{% url 'logout' %}"><img src="{% static '/assets/ícones/1x/logout.png' %}"></a>
        {% endif %}
    </header>
    {% include 'partials/_alertas.html' %}
    
    <main class="principal">
        {% if user.is_authenticated %}
            <section class="menu-lateral">
                <nav class="menu-lateral__navegacao">
                    <a href="{% url 'buscar' %}"><img src="{% static '/assets/ícones/1x/Home - ativo.png' %}"> Inicio</a>
                    <a href="#"><img src="{% static '/assets/ícones/1x/Mais vistas - inativo.png' %}"> Mais vistas</a>
                    <a href="#"><img src="{% static '/assets/ícones/1x/Novas - inativo.png' %}"> Novas</a>
                    <a href="#"><img src="{% static '/assets/ícones/1x/Surpreenda-me - inativo.png' %}"> Surpreenda-me</a>
                </nav>
            </section>
        {% endif %}
